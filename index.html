
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vancouver Parks and Green Spaces</title>

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  
</head>

<body>
  <div id="map"></div>

  <div class="map-title">
  <h1>Vancouver Parks and Green Spaces</h1>
  <p>Exploring the distribution and size of public parks</p>
</div>

<div class="map-legend">
  <h3>Park Area</h3>

  <div><span class="legend-color small"></span> Small parks (&lt; 1 ha)</div>
  <div><span class="legend-color medium"></span> Medium parks (1–5 ha)</div>
  <div><span class="legend-color large"></span> Large parks (5+ ha)</div>
</div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script>
    const map = new maplibregl.Map({
      container: 'map',

      style: './vancouver-parks-style(export).json',

      center: [-123.12, 49.25],
      zoom: 11.5
    });

    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
